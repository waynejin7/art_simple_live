name: Build iOS Windows and Android TV

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Dependencies
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build unsigned iOS app
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        working-directory: simple_live_app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr SimpleLive-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-iOS
          path: simple_live_app/build/ios/iphoneos/*.ipa

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Dependencies
        working-directory: simple_live_app
        run: flutter pub get
      - name: Fix unavailable upstream libmpv archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cmakePath = 'third_party/media_kit_libs_windows_video/windows/CMakeLists.txt'
          $content = [System.IO.File]::ReadAllText((Resolve-Path $cmakePath))
          $oldRelease = 'set(LIBMPV_RELEASE "20260828")'
          $oldRevision = 'set(LIBMPV_REVISION "182fa6ca49")'
          $oldHash = 'set(LIBMPV_SHA256 "9efd04d351e09eca350d01da1b8b0c406537c037537111ba65ab43c91905635b")'
          if ($content.Contains($oldRelease) -and $content.Contains($oldRevision) -and $content.Contains($oldHash)) {
            $content = $content.Replace($oldRelease, 'set(LIBMPV_RELEASE "20261021")')
            $content = $content.Replace($oldRevision, 'set(LIBMPV_REVISION "e471496c56")')
            $content = $content.Replace($oldHash, 'set(LIBMPV_SHA256 "efc719eff3dc5954b4a5efc800632808bcec01cc9034940dd14e5eb7fe9ea633")')
            [System.IO.File]::WriteAllText((Resolve-Path $cmakePath), $content, [System.Text.UTF8Encoding]::new($false))
            Write-Host 'Updated missing upstream libmpv archive to GitHub verified 20261021 asset.'
          } else {
            Write-Host 'Upstream libmpv reference differs; leaving it unchanged.'
          }
      - name: Build Windows
        working-directory: simple_live_app
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          $dir = "simple_live_app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$dir/*" -DestinationPath "SimpleLive-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Windows
          path: SimpleLive-Windows.zip

  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          cache: true
      - name: Dependencies
        working-directory: simple_live_tv_app
        run: flutter pub get
      - name: Configure TV release signing
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          TV_STORE_PASSWORD: ${{ secrets.TV_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for key in TV_KEYSTORE_BASE64 TV_KEY_ALIAS TV_KEY_PASSWORD TV_STORE_PASSWORD; do
            if [ -z "${!key}" ]; then
              echo "::error::Missing GitHub Actions secret: $key"
              exit 1
            fi
          done
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > simple_live_tv_app/android/app/release.jks
          {
            printf 'storeFile=release.jks\n'
            printf 'storePassword=%s\n' "$TV_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$TV_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$TV_KEY_PASSWORD"
          } > simple_live_tv_app/android/key.properties
          chmod 600 simple_live_tv_app/android/key.properties simple_live_tv_app/android/app/release.jks
      - name: Build TV APK
        working-directory: simple_live_tv_app
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android-TV
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [ios, windows, android-tv]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -type f \( -name '*.ipa' -o -name '*.zip' -o -name '*.apk' \) -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -ge 5
          ls -lh dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fork-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: SimpleLive build ${{ github.run_number }}
          generate_release_notes: false
          body: |
            Automated build from commit ${{ github.sha }}.
            iOS IPA is unsigned; Windows ZIP is portable; Android TV APKs are release-signed.
          files: dist/*
          fail_on_unmatched_files: true
