name: Build iOS Windows and Android TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true
      - name: Dependencies
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build unsigned iOS app
        working-directory: simple_live_app
        run: flutter build ios --release --no-codesign
      - name: Package IPA
        working-directory: simple_live_app
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -R Runner.app Payload/
          zip -qr SimpleLive-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-iOS
          path: simple_live_app/build/ios/iphoneos/*.ipa

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true
      - name: Dependencies
        working-directory: simple_live_app
        run: flutter pub get
      - name: Build Windows
        working-directory: simple_live_app
        run: flutter build windows --release
      - name: Package Windows
        shell: pwsh
        run: |
          $dir = "simple_live_app/build/windows/x64/runner/Release"
          Compress-Archive -Path "$dir/*" -DestinationPath "SimpleLive-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Windows
          path: SimpleLive-Windows.zip

  android-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true
      - name: Dependencies
        working-directory: simple_live_tv_app
        run: flutter pub get
      - name: Build TV APK
        working-directory: simple_live_tv_app
        run: flutter build apk --debug --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleLive-Android-TV
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*-debug.apk
          if-no-files-found: error
