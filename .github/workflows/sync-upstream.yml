name: Sync upstream and build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/xiaoyaocz/dart_simple_live.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/master
          git push origin HEAD:master
      - name: Trigger build after sync
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          # GITHUB_TOKEN pushes do not trigger push workflows.
          # Dispatch an explicit build instead, but only if the repo changed.
          if [ "$(git rev-parse HEAD)" != "${{ github.sha }}" ]; then
            gh workflow run build-desktop-ios.yml --ref master
          fi
