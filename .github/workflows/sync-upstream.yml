name: Sync upstream and build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward upstream changes
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/June6699/dart_simple_live.git
          git fetch upstream master
          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot create/update workflow files on push.
          # Keep this fork's workflow definitions and only sync upstream app code.
          git merge --no-commit --no-ff upstream/master
          git restore --source=HEAD --staged --worktree -- .github/workflows
          git commit -m "chore: sync upstream (preserve fork workflows)"
          git push origin HEAD:master
      - name: Trigger build after sync
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          # GITHUB_TOKEN pushes do not trigger push workflows.
          # Dispatch an explicit build instead, but only if the repo changed.
          if [ "$(git rev-parse HEAD)" = "${{ github.sha }}" ]; then
            echo "No new upstream changes, skipping build dispatch."
            exit 0
          fi
          # The dispatch can fail transiently right after the push above
          # (new commit not yet visible to the Actions API), so retry gh
          # first and fall back to a direct workflow-dispatch API call.
          for attempt in 1 2 3; do
            echo "Dispatch attempt $attempt with gh..."
            if gh workflow run build-desktop-ios.yml --repo "${{ github.repository }}" --ref master; then
              echo "Build dispatched."
              exit 0
            fi
            echo "::warning::gh dispatch attempt $attempt failed, retrying in 30s..."
            sleep 30
          done
          echo "gh dispatch failed after 3 attempts, trying the REST API..."
          http_code="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-desktop-ios.yml/dispatches" \
            -d '{"ref":"master"}')"
          echo "REST dispatch HTTP status: $http_code"
          cat /tmp/dispatch-response.txt
          if [ "$http_code" = "204" ]; then
            echo "Build dispatched via REST API."
            exit 0
          fi
          echo "::error::Failed to dispatch build after gh retries and REST fallback (HTTP $http_code)."
          exit 1
